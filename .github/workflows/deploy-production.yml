name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to latest)"
        required: false
        default: "latest"
  workflow_run:
    workflows: ["Deploy to Staging"]
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kayaka-app
  ECS_SERVICE: kayaka-production-service
  ECS_CLUSTER: kayaka-production-cluster
  ECS_TASK_DEFINITION: .github/task-definitions/production.json
  CONTAINER_NAME: app

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Smoke test staging endpoint
        run: |
          curl -f -s --retry 5 --retry-delay 10 \
            "${{ secrets.STAGING_URL }}/health" || exit 1

  terraform-plan-apply:
    name: Provision Production Infrastructure
    runs-on: ubuntu-latest
    environment: production
    needs: [smoke-test-staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require AWS_ACCOUNT_ID secret
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [[ -z "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Set the AWS_ACCOUNT_ID repository secret to your 12-digit AWS account ID."
            echo "::error::Then create the OIDC roles: cd bootstrap && terraform init && terraform apply"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="key=infrastructure/production/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform workspace select -or-create production
          terraform apply -var-file=environments/production.tfvars -auto-approve

  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    environment: production
    needs: [terraform-plan-apply]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build-image
        working-directory: app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} $REGISTRY/${{ env.ECR_REPOSITORY }}:prod-${{ github.sha }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:prod-${{ github.sha }}
          echo "image=$REGISTRY/${{ env.ECR_REPOSITORY }}:prod-${{ github.sha }}" >> $GITHUB_OUTPUT

    outputs:
      image: ${{ steps.build-image.outputs.image }}

  approve-production:
    name: "Approve Production Deployment"
    runs-on: ubuntu-latest
    environment: production
    needs: [terraform-plan-apply]
    if: always()
    steps:
      - run: echo "Approval required for production deployment"

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > ${{ env.ECS_TASK_DEFINITION }}

      - name: Fill in the new image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Wait for healthy rollout
        run: |
          sleep 60
          curl -f -s "${{ secrets.PRODUCTION_URL }}/health" || exit 1

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-to-production]
    if: always()
    steps:
      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#deployments"
          SLACK_TITLE: "Production Deployment Successful"
          SLACK_MESSAGE: "Deployed commit ${{ github.sha }} to production"
          SLACK_COLOR: good
          SLACK_ICON: ":rocket:"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#deployments"
          SLACK_TITLE: "Production Deployment Failed"
          SLACK_MESSAGE: "Production deployment failed at run ${{ github.run_number }}"
          SLACK_COLOR: danger
          SLACK_ICON: ":rotating_light:"