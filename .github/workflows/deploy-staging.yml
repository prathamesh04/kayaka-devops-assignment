name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "terraform/**"
      - ".github/workflows/**"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kayaka-app
  IMAGE_TAG: ${{ github.sha }}
  ECS_SERVICE: kayaka-staging-service
  ECS_CLUSTER: kayaka-staging-cluster
  ECS_TASK_DEFINITION: .github/task-definitions/staging.json
  CONTAINER_NAME: app

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to Amazon ECR
        id: build-image
        working-directory: app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "image=$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

    outputs:
      image: ${{ steps.build-image.outputs.image }}

  terraform-plan-apply:
    name: Provision Staging Infrastructure
    runs-on: ubuntu-latest
    environment: staging
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="key=infrastructure/staging/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform workspace select -or-create staging
          terraform apply -var-file=environments/staging.tfvars -auto-approve

  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: staging
    needs: [terraform-plan-apply]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > ${{ env.ECS_TASK_DEFINITION }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  notify:
    name: Notify Staging Deployment
    runs-on: ubuntu-latest
    needs: [deploy-ecs]
    if: always()
    steps:
      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#deployments"
          SLACK_TITLE: "Staging Deployment Successful"
          SLACK_MESSAGE: "v${{ github.sha }} deployed to staging"
          SLACK_COLOR: good
          SLACK_ICON: ":rocket:"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#deployments"
          SLACK_TITLE: "Staging Deployment Failed"
          SLACK_MESSAGE: "Deployment failed at workflow run ${{ github.run_number }}"
          SLACK_COLOR: danger
          SLACK_ICON: ":rotating_light:"