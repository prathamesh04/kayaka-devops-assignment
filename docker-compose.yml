version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: kayaka-postgres
    environment:
      POSTGRES_USER: kayaka
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kayaka
    ports:
      - "5432:5432"
    volumes:
      - kayaka-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayaka"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./app
    container_name: kayaka-migrate
    environment:
      DATABASE_URL: postgresql://kayaka:postgres@db:5432/kayaka
      NODE_ENV: development
    command: ["node", "src/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  seed:
    build:
      context: ./app
    container_name: kayaka-seed
    environment:
      DATABASE_URL: postgresql://kayaka:postgres@db:5432/kayaka
      NODE_ENV: development
    command: ["node", "src/db/seed.js"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: ./app
    container_name: kayaka-app
    environment:
      DATABASE_URL: postgresql://kayaka:postgres@db:5432/kayaka
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: kayaka-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: kayaka-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  kayaka-pg-data:
  grafana-data: